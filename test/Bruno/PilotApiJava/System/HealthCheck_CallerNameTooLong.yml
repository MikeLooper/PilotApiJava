info:
  name: HealthCheck_CallerNameTooLong
  type: http
  seq: 4

http:
  method: GET
  url: "{{Host}}healthcheck"
  headers:
    - name: X-Caller-Name
      value: "Caller-Name-Longer-Than-100-Characters-0123456789-0123456789-0123456789-0123456789-0123456789-0123456789"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should explain the X-Caller-Name length violation", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("status", 400);
          expect(resBody.detail).to.contain("X-Caller-Name");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
