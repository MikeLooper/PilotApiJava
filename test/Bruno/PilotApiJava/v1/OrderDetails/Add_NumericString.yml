info:
  name: Add_NumericString
  type: http
  seq: 8

http:
  method: POST
  url: "{{Host}}v{{version}}/{{controller}}/add"
  body:
    type: json
    data: |-
      {
        "discount": 0,
        "orderId": 10248,
        "productId": 12,
        "quantity": "99",
        "unitPrice": 99.0000
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should report quantity sent as a string", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("status", 400);
          expect(resBody.detail).to.include("Cannot coerce String value");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
