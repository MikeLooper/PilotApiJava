info:
  name: Add_NumericString
  type: http
  seq: 8

http:
  method: POST
  url: "{{Host}}v{{version}}/{{controller}}/add"
  body:
    type: json
    data: |-
      {
        "supplierId": "1",
        "address": "49 Gilbert St.",
        "city": "London",
        "companyName": "Test Company",
        "contactName": "Test Name",
        "contactTitle": "Test Title",
        "country": "UK",
        "fax": null,
        "homePage": null,
        "phone": "(171) 555-2222",
        "postalCode": "EC1 4SD",
        "region": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should report supplierId sent as a string", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("status", 400);
          expect(resBody.detail).to.include("Cannot coerce String value");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
