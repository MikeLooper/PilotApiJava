info:
  name: Add_CompanyNameTooLong
  type: http
  seq: 6

http:
  method: POST
  url: "{{Host}}v{{version}}/{{controller}}/add"
  body:
    type: json
    data: |-
      {
        "companyName": "Company Name Longer Than Forty Characters",
        "phone": "(171) 555-2222"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should explain the companyName length violation", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("status", 400);
          expect(resBody).to.have.property("detail");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
