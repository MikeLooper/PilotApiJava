info:
  name: Add_NumericString
  type: http
  seq: 8

http:
  method: POST
  url: "{{Host}}v{{version}}/{{controller}}/add"
  body:
    type: json
    data: |-
      {
        "customerId": "VINET",
        "employeeId": 5,
        "freight": "32.3800",
        "orderDate": "1996-07-04T00:00:00",
        "requiredDate": "1996-08-01T00:00:00",
        "shipAddress": "123 Main Street",
        "shipCity": "Test City",
        "shipCountry": "France",
        "shipName": "Test Name",
        "shippedDate": "1996-07-16T00:00:00",
        "shipPostalCode": "51100",
        "shipRegion": null,
        "shipVia": 3
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should report freight sent as a string", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("status", 400);
          expect(resBody.detail).to.include("Cannot coerce String value");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
