server:
  port: ${SERVER_PORT:56661}

spring:
  application:
    name: PilotApiJava
  datasource:
    url: ${DB_URL:jdbc:sqlserver://local_mssql:1433;databaseName=NorthWind;encrypt=true;trustServerCertificate=true;connectTimeout=30}
    username: ${DB_USERNAME:DevUser}
    password: ${DB_PASSWORD:<user-password>}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.SQLServerDialect}
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:}
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false
    default-schema: ${DB_SCHEMA:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  metadata:
    name: PilotApiJava
    build-version: ${APP_BUILD_VERSION:0.2.0}
    deploy-date: ${APP_DEPLOY_DATE:unknown}
  security:
    active: ${APP_SECURITY_ACTIVE:true}
    provider-url: ${APP_SECURITY_PROVIDER_URL:http://local-keycloak:8080}
    realm: ${APP_SECURITY_REALM:local-realm}
    client-id: ${APP_SECURITY_CLIENT_ID:local-client}
    resource-area: ${APP_SECURITY_RESOURCE_AREA:account}