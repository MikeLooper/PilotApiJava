name: Pull request build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@c5195efecf7bdfc987eeaaad021965b568c1ec85 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
